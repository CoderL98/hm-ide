<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>hm-ide editor host</title>
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
      background: #0c0c0e;
      color: #fafafa;
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    #root { width: 100%; height: 100%; }
    #fallback {
      display: none;
      height: 100%;
      box-sizing: border-box;
    }
    #fallback.shown { display: flex; }
    #gutter {
      flex-shrink: 0;
      width: 52px;
      padding: 12px 0;
      text-align: right;
      color: #52525b;
      user-select: none;
      background: #0c0c0e;
      font-size: 13px;
      line-height: 1.65;
      overflow: hidden;
    }
    #gutter div { padding-right: 12px; height: 21.45px; }
    #codeWrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    #codeArea {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      resize: none;
      background: #0c0c0e;
      color: #fafafa;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.65;
      padding: 12px 16px 12px 12px;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }
    body[data-theme="light"] { background: #ffffff; color: #09090b; }
    body[data-theme="light"] #gutter,
    body[data-theme="light"] #codeArea { background: #ffffff; }
    body[data-theme="light"] #gutter { color: #a1a1aa; }
    body[data-theme="light"] #codeArea { color: #09090b; }
    .status-pill {
      position: absolute;
      right: 8px;
      bottom: 8px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #27272a;
      color: #a1a1aa;
      z-index: 5;
      pointer-events: none;
      opacity: 0.85;
    }
  </style>
</head>
<body data-theme="dark">
  <div id="root"></div>
  <div id="fallback">
    <div id="gutter" aria-hidden="true"></div>
    <div id="codeWrap">
      <textarea id="codeArea" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    </div>
  </div>
  <div class="status-pill" id="modePill">monaco</div>
  <script src="./bridge.js"></script>
  <script src="./vs/loader.js"></script>
  <script src="./boot.js"></script>
</body>
</html>
